  <input id="k" type="text" placeholder="XXXX_XXXX" autocomplete="off" aria-label="Produktkey" style="text-align:center"><div class="msg" id="msg">${prem?"✅ Premium ist bereits aktiv.":""}</div>
  <button class="btn" id="go">Key einlösen</button> ${prem?'<button class="btn ghost" id="rs">Premium zurücksetzen</button>':""}</section>
  <h2 style="text-align:center;margin:26px 0 0">Noch keinen Key? Kauf dir den Sieg. 🏆</h2><p style="text-align:center;color:var(--mute);margin:4px 0">Angebot endet in ${cdh()} · 🔥 Nur noch 3 Keys!</p>
  <div class="tiers">
  ${[["Zivi Basic","4,99","24,99","+5 Fragen*",["5 weitere Fragen","Werbung bleibt","Warteschlange: Platz 12"]],["Zivi Pro","19,99","99,99","+50 Fragen*",["50 weitere Fragen","Kategorien ansehen","Warteschlange: Platz 2"]],["Zivi Ultra 👑","49,99","399,99","ALLE Fragen",["Alle "+DATA.length+" Fragen","Keine Werbung","Richtig-Marker ✓","Kein Warten","Pay2Win-Badge ✦"]]].map((t,i)=>`<div class="card glass ${i==2?"best":""}"><h4>${t[0]}</h4><div class="pr">${t[1]} €<small style="font-size:13px">/Monat</small> <s>${t[2]} €</s></div><b style="color:var(--g)">${t[3]}</b><ul>${t[4].map(x=>`<li>✓ ${x}</li>`).join("")}</ul><button class="btn sm" style="width:100%;margin-top:10px" data-b="${i}">Jetzt kaufen</button></div>`).join("")}</div>
  <p class="agb" style="text-align:center">* Preise zzgl. Servicegebühr, Bearbeitungsgebühr und Gebühr für die Gebühr. Siehe <a href="#agb">AGB</a>.</p>`;
  const chk=()=>{const v=$("#k").value.trim();const m=$("#msg");
    if(v===KEY){prem=true;st.set("zc_prem","1");setPrem();m.style.color="var(--ok)";m.textContent="🎉 Key gültig! Du bist jetzt Pay2Win-Zivi.";confetti();setTimeout(()=>location.hash="",1800)}
    else{m.style.color="var(--pk)";m.textContent=v?"❌ Ungültiger Key. Kauf einen für nur 49,99 €.":"Bitte gib einen Key ein.";const k=$("#k");k.classList.remove("shake");void k.offsetWidth;k.classList.add("shake")}};
  $("#go").onclick=chk;$("#k").onkeydown=e=>{if(e.key==="Enter")chk()};
  $("#rs")&&($("#rs").onclick=()=>{prem=false;st.set("zc_prem","0");setPrem();unlock()});
  document.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>modal(`<div style="font-size:44px">💳</div><h3>Zahlung abgelehnt</h3><p>Dein Zahlungsanbieter hat „Zivildienst-Gehalt“ als Sicherheit abgelehnt. (Das ist eine Spaßseite, es wird nichts abgebucht.)</p><button class="btn" data-x>Okay</button>`));
}
// AGB
function agb(){const c=["Diese Seite ist Satire. Alle Preise, Laufzeiten und Drohungen sind erfunden.","Der Nutzer erkennt an, dass Wissen kein Grundrecht, sondern ein Abo-Modell ist.","Fragen 6 bis "+DATA.length+" sind ausschließlich für Nutzer mit ausgeprägtem Pflichtbewusstsein sichtbar.","Premium verlängert sich automatisch alle 5 Minuten um weitere 5 Minuten. Kündigung nur schriftlich per Brieftaube.","Die Mindestlaufzeit beträgt 36 Monate, der Zivildienst dauert aber nur 9. Das Delta ist Verhandlungssache.","Der Betreiber darf Antwort b jederzeit für falsch erklären, auch wenn sie richtig ist.","Der Nutzer verzichtet auf sein Seelenheil sowie auf den Kaffee aus der Teeküche.","Produktkeys bleiben Eigentum des Betreibers. Ein Weitergeben an Kameraden gilt als Wehrkraftzersetzung.","Eine Gebühr für die Servicegebühr (2,50 €) ist im Preis nicht enthalten.","Wer die Cookies ablehnt, zahlt 2,99 € Ablehnungsgebühr.","Blur-Effekte sind kein Mangel, sondern Feature. Eine Brille ändert daran nichts.","Bei Nichtbestehen der Prüfung besteht Anspruch auf kein Geld zurück, aber auf Mitleid (nicht einklagbar).","Gerichtsstand ist der Beifahrersitz.","Charlie darf jederzeit in deiner Nähe auftauchen. Die Entfernung wird nicht garantiert.","Coins verfallen sofort, außer du zahlst. Dann verfallen sie auch, aber langsamer.","Lootboxen sind kein Glücksspiel, weil man nie gewinnt."];
  $("#app").innerHTML=`<section class="hero glass agb"><h1 style="color:var(--tx)">Allgemeine Geschäftsbedingungen</h1>${c.map((x,i)=>`<h3>§ ${i+1}</h3><div>${x}</div>`).join("")}<p><a href="#">← Zurück</a></p></section>`}
function route(){const h=location.hash.slice(1);scrollTo(0,0);h==="freischalten"?unlock():h==="agb"?agb():home();$("#cf").width=$("#cf").width}
addEventListener("hashchange",route);setPrem();route();
// annoyances (nur Free)
const names=["Max aus Linz","Lena aus Wien","Jonas aus Graz","Sara aus Innsbruck","Kevin aus Villach"];
setInterval(()=>{if(!prem&&!document.querySelector(".mod")&&!location.hash)toast(`🔥 <b>${names[Math.random()*5|0]}</b> hat gerade Zivi Ultra gekauft!`)},11000);
setInterval(()=>{const e=$("#lv");e&&(e.textContent=35+Math.random()*20|0)},3000);
if(!prem)setTimeout(()=>{const c=document.createElement("div");c.className="ck glass";c.innerHTML=`🍪 Wir verwenden Cookies, Daten und deine Lebenszeit.<div class="row"><button class="btn sm" id="ca">Alles akzeptieren</button><button class="tiny" id="cn" style="width:auto;margin:0">ablehnen</button></div>`;document.body.append(c);
  $("#ca").onclick=()=>c.remove();$("#cn").onclick=()=>{c.remove();modal(`<div style="font-size:44px">🍪</div><h3>Ablehnen kostet 2,99 €</h3><p>Siehe AGB § 10.</p><div class="row"><button class="btn" data-x>Dann akzeptiere ich</button></div>`)}},2500);
function lootbox(){const o=["💩 Nichts. Nochmal öffnen für 0,99 €?","🎟️ −3 % Rabatt auf Zivi Ultra (nicht kombinierbar, nicht gültig)","🪙 +0 Coins. Glückwunsch!","👑 LEGENDÄR: 1 Minute Premium! (läuft ab, bevor du es nutzt)","🧦 Ein virtuelles Paar Socken"];
  const m=modal(`<div style="font-size:56px" class="shake">🎁</div><h3>Lootbox wird geöffnet …</h3>`);
  setTimeout(()=>{m.querySelector(".box").innerHTML=`<h3>${o[Math.random()*o.length|0]}</h3><p>Du hast heute keine weiteren Öffnungen. Zusätzliche Lootboxen: 3 für 4,99 €.</p><div class="row"><a class="btn" href="#freischalten" data-x>Mehr Lootboxen</a><button class="btn ghost" data-x>Schließen</button></div>`},1400)}
let km=2;
function charlie(){if(document.querySelector(".mod"))return;const m=modal(`<div style="font-size:48px">📍🚑</div><h3>Charlie ist ${String(km).replace(".",",")} km entfernt von dir</h3><p>Dein Lieblingssani ist in deiner Nähe und hat gerade nach dir gefragt. 👀</p><div class="row"><button class="btn" id="cw">💬 Nachricht schreiben</button><button class="btn ghost" data-x>Ignorieren</button></div><span class="tiny">Premium-Feature: Schreiben, Anrufen, Mitfahren</span>`);
  $("#cw").onclick=()=>{m.remove();prem?modal(`<div style="font-size:44px">🚑</div><h3>Charlie:</h3><p>„Ey, hör auf zu daddeln und lern!“</p><button class="btn" data-x>Okay, Charlie</button>`):upsell("Charlie schreiben ist Premium")};km=Math.max(.2,+(km-.4).toFixed(1))}
setTimeout(charlie,7000);setInterval(charlie,40000);
if(!prem){const s=document.createElement("button");s.className="btn sm sup";s.style.cssText="position:fixed;right:14px;bottom:calc(200px + env(safe-area-inset-bottom,0px));z-index:70";s.textContent="💬 Support";s.onclick=()=>modal(`<div style="font-size:44px">🎧</div><h3>Support-Chat</h3><p>Gratis-Wartezeit: <b>47 Tage</b>.<br>Premium-Support: <b>sofort</b> (Antwort: „Haben Sie es mit Premium versucht?“).</p><div class="row"><a class="btn" href="#freischalten" data-x>Premium-Support</a><button class="btn ghost" data-x>Warten</button></div>`);document.body.append(s)}
let ex=0;document.addEventListener("mouseleave",e=>{if(!prem&&!ex&&e.clientY<5){ex=1;upsell("Warte! Geh nicht ohne Premium.")}});
</script>
</body>
